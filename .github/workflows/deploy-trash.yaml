name: deploy-trash

on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate the visual test screenshots in CI and commit them"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: trash_app, POSTGRES_PASSWORD: test, POSTGRES_DB: trash_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U trash_app -d trash_test" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://trash_app:test@localhost:5432/trash_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build # the install tests check the built manifest, icons and service worker
      - run: npm run test:integration

  visual:
    runs-on: ubuntu-latest
    # Same image every run, so fonts and rendering match the committed screenshots.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: trash_app, POSTGRES_PASSWORD: test, POSTGRES_DB: trash_test }
        options: --health-cmd "pg_isready -U trash_app -d trash_test" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://trash_app:test@postgres:5432/trash_test
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - name: Visual tests
        if: ${{ !inputs.update_snapshots }}
        run: npx playwright test
      - name: Regenerate screenshots
        if: ${{ inputs.update_snapshots }}
        run: |
          npx playwright test --update-snapshots
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__
          git diff --cached --quiet || { git commit -m "test: update visual snapshots (generated in CI)"; git push; }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    needs: [unit, integration, visual]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.update_snapshots)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger infrastructure deployment
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.INFRASTRUCTURE_PAT }}
          repository: markmorcos-dev/infrastructure
          event-type: deploy-trash
          client-payload: |-
            {
              "repository": "markmorcos/trash",
              "token": "${{ secrets.DEPLOYMENT_TOKEN }}",
              "version": "${{ github.sha }}",
              "config_file": "deployment.yaml"
            }
